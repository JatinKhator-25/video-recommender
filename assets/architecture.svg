<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Video Recommender — Pipeline</text>

  <!-- Box 1: SQLite -->
  <rect x="325" y="60" width="250" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">SQLite Database</text>
  <text x="450" y="101" text-anchor="middle" font-size="11.5" fill="#374151">users · videos · interactions</text>

  <line x1="450" y1="115" x2="450" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Feature Engineering -->
  <rect x="275" y="150" width="350" height="70" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="450" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#14532D">Feature Engineering</text>
  <text x="450" y="192" text-anchor="middle" font-size="11.5" fill="#374151">user taste profiles + video feature vectors</text>
  <text x="450" y="208" text-anchor="middle" font-size="11.5" fill="#374151">(category, language, duration)</text>

  <line x1="450" y1="220" x2="450" y2="255" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Similarity Scoring -->
  <rect x="275" y="255" width="350" height="70" rx="8" fill="#FEF3F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="450" y="279" text-anchor="middle" font-size="14" font-weight="600" fill="#7F1D1D">Similarity Scoring</text>
  <text x="450" y="297" text-anchor="middle" font-size="11.5" fill="#374151">per-feature cosine similarity</text>
  <text x="450" y="313" text-anchor="middle" font-size="11.5" fill="#374151">weighted: category 0.75 · language 0.15 · duration 0.10</text>

  <line x1="450" y1="325" x2="450" y2="360" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Contextual Re-ranking -->
  <rect x="275" y="360" width="350" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#78350F">Contextual Re-ranking</text>
  <text x="450" y="402" text-anchor="middle" font-size="11.5" fill="#374151">time-of-day boost applied at request time</text>

  <line x1="450" y1="420" x2="450" y2="455" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Output -->
  <rect x="325" y="455" width="250" height="55" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="450" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">Top-N Recommendations</text>
  <text x="450" y="496" text-anchor="middle" font-size="11.5" fill="#374151">ranked, unwatched videos</text>

  <!-- Cold start branch -->
  <line x1="625" y1="185" x2="700" y2="185" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="185" x2="700" y2="470" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="470" x2="580" y2="482" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="670" y="140" width="180" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="760" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">New user?</text>
  <text x="760" y="182" text-anchor="middle" font-size="10.5" fill="#4B5563">no watch history</text>
  <text x="760" y="197" text-anchor="middle" font-size="10.5" fill="#4B5563">→ popular videos</text>
  <text x="760" y="210" text-anchor="middle" font-size="10.5" fill="#4B5563">in their language</text>

  <text x="760" y="130" text-anchor="middle" font-size="10.5" fill="#6B7280" font-style="italic">cold-start fallback</text>
</svg>
